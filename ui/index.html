<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbfbf9" />
    <!-- Every route is behind auth and none is a search surface. -->
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>newspapper</title>
    <!-- The Light / Dark / System choice, applied before first paint so nothing flashes. It says what
         lib/appearance.ts says for the stored choice, and a test keeps the two in step. -->
    <script>
      (function () {
        var dark = false;
        try {
          var choice = localStorage.getItem("newspapper-appearance");
          dark = choice === "dark" || (choice === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        } catch (e) {}
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta && dark) meta.setAttribute("content", "#1b1c1f");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
